# Builds the UbuRoot APK, which is also the Magisk/KernelSU/APatch module zip
# (the module files sit at the APK root, see CLAUDE.md), and runs every test
# that does not need a phone.
#
# Release signing (optional, repository secrets):
#   UBUROOT_KEYSTORE_BASE64   base64 of the .jks keystore
#   UBUROOT_KEYSTORE_PASSWORD, UBUROOT_KEY_ALIAS, UBUROOT_KEY_PASSWORD
# Without them, only the debug build is published as an artifact (signed with
# the runner's throwaway debug key, so it cannot update a previous install).
# A tag "v*" with the secrets set creates a GitHub release.
#
# Tags and manual runs also build the GPU driver (Mesa's Turnip with the KGSL backend,
# tools/gpu/build-turnip.sh, from Ubuntu's own mesa source package): the app's
# *Install GPU driver* button downloads it from the latest release (docs/GUI.md).
name: CI

on:
  push:
    branches: [main, "phase-*"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scripts:
    name: Shell scripts (shellcheck, reset guard, Docker real mounts)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck
        run: tests/shellcheck.sh
      - name: Reset guard (critical rule, fake mounts)
        run: tests/test_reset_guard.sh
      - name: Docker suite (real mounts, real apt)
        run: tests/docker/run.sh

  build:
    name: APK + root module
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # Job-wide, so every Gradle invocation sees the same signing setup.
    env:
      UBUROOT_KEYSTORE_PASSWORD: ${{ secrets.UBUROOT_KEYSTORE_PASSWORD }}
      UBUROOT_KEY_ALIAS: ${{ secrets.UBUROOT_KEY_ALIAS }}
      UBUROOT_KEY_PASSWORD: ${{ secrets.UBUROOT_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      - name: Release keystore (if configured)
        env:
          KEYSTORE_BASE64: ${{ secrets.UBUROOT_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d >"$RUNNER_TEMP/release.jks"
            echo "UBUROOT_KEYSTORE=$RUNNER_TEMP/release.jks" >>"$GITHUB_ENV"
          else
            echo "No release keystore: release APK stays unsigned and is not published."
          fi

      - name: Kotlin lint (ktlint via Spotless)
        run: ./gradlew spotlessCheck

      - name: Build and unit tests
        run: ./gradlew assembleDebug assembleRelease testDebugUnitTest

      - name: Package APK + module zip
        run: tools/ci-package.sh dist

      - uses: actions/upload-artifact@v7
        with:
          name: uburoot-${{ github.sha }}
          path: dist/*
          if-no-files-found: error

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

  turnip:
    name: GPU driver (Turnip KGSL, arm64)
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Cross-build from Ubuntu's mesa source
        run: |
          set -eu
          mkdir -p out
          docker run --rm -v "$PWD/out:/out" -v "$PWD/tools/gpu:/gpu:ro" ubuntu:26.04 sh /gpu/build-turnip.sh
          sudo chown -R "$(id -u):$(id -g)" out
          set -- out/turnip-kgsl-*-arm64.tar.gz
          [ -f "$1" ]
          cp "$1" out/turnip-kgsl-arm64.tar.gz
          ls -l out
      - uses: actions/upload-artifact@v7
        with:
          name: turnip-${{ github.sha }}
          path: out/*.tar.gz
          if-no-files-found: error

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [scripts, build, turnip]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: uburoot-${{ github.sha }}
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: turnip-${{ github.sha }}
          path: dist
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          ls dist
          set -- dist/uburoot-*-release.apk
          [ -f "$1" ] || { echo "no signed release APK (keystore secrets missing?)" >&2; exit 1; }
          # Only what is published (the artifact's SHA256SUMS also lists the debug build).
          (cd dist && sha256sum uburoot-*-release.apk uburoot-*-release-module.zip \
            uburoot.apk uburoot-module.zip turnip-kgsl-*.tar.gz >SHA256SUMS)
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "UbuRoot $TAG" --generate-notes \
            dist/uburoot-*-release.apk dist/uburoot-*-release-module.zip \
            dist/uburoot.apk dist/uburoot-module.zip dist/turnip-kgsl-*.tar.gz dist/SHA256SUMS
